<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JA_SELLZ Admin</title><style>
body{margin:0;background:#0b0b0d;color:#f7f7f7;font-family:Arial;padding:20px}main{max-width:1000px;margin:auto}.card{background:#151518;border:1px solid #29292e;border-radius:18px;padding:20px;margin:16px 0}input,select{width:100%;box-sizing:border-box;background:#0f0f12;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;margin-top:6px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.danger{background:#35151a;color:#fff}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.sizes{display:flex;gap:8px;flex-wrap:wrap}.size{width:80px}.images{display:flex;gap:8px;flex-wrap:wrap}.thumb{width:75px;height:75px;object-fit:cover;border-radius:8px;border:1px solid #444}.muted{color:#aaa}.product-head{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}.login{max-width:420px;margin:15vh auto}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<div id="login" class="login card"><h1>JA_SELLZ Admin</h1><p class="muted">Inventory and product management</p><label>Admin password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" style="margin-top:12px" onclick="login()">Log in</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden"><div class="product-head"><div><h1>JA_SELLZ Admin</h1><p class="muted">Change stock, sizes, prices and product photos.</p></div><button class="primary" onclick="saveAll()">Save changes</button></div><p id="msg" class="muted"></p><div id="products"></div></div>
</main><script>
let products=[];
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){document.getElementById('loginMsg').textContent=d.error||'Login failed';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load();}
async function load(){const r=await fetch('/api/products?x='+Date.now());products=await r.json();render();}
function render(){document.getElementById('products').innerHTML=products.map((p,i)=>`<div class="card"><div class="product-head"><h2>${esc(p.name)}</h2><button class="danger" onclick="removeProduct(${i})">Remove</button></div><div class="row"><label>Name<input value="${escAttr(p.name)}" oninput="products[${i}].name=this.value"></label><label>Price<input type="number" min="0" step="0.01" value="${p.price}" oninput="products[${i}].price=Number(this.value)"></label><label>Total stock<input type="number" min="0" value="${p.stock}" oninput="products[${i}].stock=Math.max(0,parseInt(this.value||0))"></label></div><label>Category<select onchange="products[${i}].category=this.value"><option ${p.category==='Clothes'?'selected':''}>Clothes</option><option ${p.category==='Sneakers'?'selected':''}>Sneakers</option><option ${p.category==='Fragrances'?'selected':''}>Fragrances</option><option ${p.category==='Accessories'?'selected':''}>Accessories</option></select></label><h3>Size stock</h3><div class="sizes">${['S','M','L','XL','XXL'].map(s=>`<label class="size">${s}<input type="number" min="0" value="${p.sizes?.[s]??0}" oninput="products[${i}].sizes=products[${i}].sizes||{};products[${i}].sizes['${s}']=Math.max(0,parseInt(this.value||0))"></label>`).join('')}</div><h3>Product photos</h3><div class="images">${(p.images||[p.image]).map((im,j)=>`<div><img class="thumb" src="images/${encodeURIComponent(im)}"><br><button onclick="setMain(${i},${j})">${im===p.image?'Main':'Set main'}</button></div>`).join('')}</div><label>Add photo<input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadImage(${i},this.files[0])"></label></div>`).join('');}
async function uploadImage(i,file){if(!file)return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=(products[i].name+'-'+Date.now()).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.'+ext;const reader=new FileReader();reader.onload=async()=>{const r=await fetch('/api/admin/upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:safe,data:reader.result})});const d=await r.json();if(!r.ok)return alert(d.error||'Upload failed');products[i].images=products[i].images||[];products[i].images.push(d.filename);render();};reader.readAsDataURL(file);}
function setMain(i,j){products[i].image=products[i].images[j];render();}
function removeProduct(i){if(confirm('Remove this product?')){products.splice(i,1);render();}}
async function saveAll(){const r=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products})});const d=await r.json();document.getElementById('msg').textContent=r.ok?'Saved successfully.':(d.error||'Save failed.');if(r.ok){products=d.products;render();}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
